<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>同窓ライブ タイムテーブル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky status header (now / running act / ahead-behind), cool-grouped run sheet below, operator bar pinned to the bottom for staff. */
:root{
  --bg:#f7f1e6; --surface:#fffdf8; --ink:#1f2a44; --mute:#6b7389; --line:#e4dccb;
  --navy:#1f2a44; --onnavy:#ffffff;
  --c1:#e8567a; --c2:#2a9d8f; --c3:#c98a0d; --c4:#5b6dd8;
  --late:#c8372d; --latebg:#fbe3df; --early:#1d7f74; --earlybg:#d9f0ec; --ontime:#6b7389;
  --live:#e8567a;
  --f:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --m:"DM Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#192131; --ink:#eef0f6; --mute:#9aa3ba; --line:#2b3550;
  --navy:#0b0f18; --onnavy:#eef0f6;
  --c1:#f07a98; --c2:#4cc0b1; --c3:#e4ad3a; --c4:#8996f0;
  --late:#ff8c82; --latebg:#4a2321; --early:#6fd6c8; --earlybg:#173a36; --ontime:#9aa3ba; --live:#f07a98;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#192131; --ink:#eef0f6; --mute:#9aa3ba; --line:#2b3550;
  --navy:#0b0f18; --onnavy:#eef0f6;
  --c1:#f07a98; --c2:#4cc0b1; --c3:#e4ad3a; --c4:#8996f0;
  --late:#ff8c82; --latebg:#4a2321; --early:#6fd6c8; --earlybg:#173a36; --ontime:#9aa3ba; --live:#f07a98;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  background:var(--navy);color:var(--onnavy);padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--onnavy);border-radius:8px;padding:6px 0;font-weight:700;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--onnavy);color:var(--navy)}
.bar .sub{font-size:12px;opacity:.7}
.clock{font-family:var(--m);font-size:15px;font-variant-numeric:tabular-nums}
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:end;margin-top:10px}
.now .lab{font-size:11px;letter-spacing:.08em;opacity:.7}
.now .who{font-size:22px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.now .el{font-size:12px;opacity:.8;margin-top:2px}
.delay{border-radius:10px;padding:6px 12px;text-align:center;min-width:92px}
.delay .v{font-family:var(--m);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.delay .t{font-size:12px;font-weight:700}
.delay.late{background:var(--latebg);color:var(--late)}
.delay.early{background:var(--earlybg);color:var(--early)}
.delay.ontime{background:rgba(255,255,255,.14);color:var(--onnavy)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--live);width:0;transition:width .4s}

/* list */
.cool{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.cool b{font-size:16px;font-weight:900;color:var(--cc)}
.cool span{flex:1;height:2px;background:var(--cc);opacity:.35}
.cool small{color:var(--mute);font-size:12px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;margin:0 0 6px;background:var(--surface);
  border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px}
.row .tm{font-family:var(--m);font-size:14px;line-height:1.25;font-variant-numeric:tabular-nums}
.row .tm s{display:block;color:var(--mute);font-size:11px;text-decoration:none}
.row .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.row .nm small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.row .st{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.row.done{opacity:.5}
.row.done .st{border-color:transparent}
.row.live{border-color:var(--live);border-left-color:var(--live);box-shadow:0 0 0 2px color-mix(in srgb,var(--live) 30%,transparent)}
.row.live .st{background:var(--live);border-color:var(--live);color:#fff}
.row.live .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.row.live .st::before{animation:none}.prog i{transition:none}}
.row.prog-item{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.row.prog-item .tm s,.row.prog-item .nm small{color:var(--onnavy);opacity:.7}
.row.break{background:transparent;border-style:dashed;border-left-style:dashed;padding:7px 12px}
.row.break .nm{font-weight:500;color:var(--mute)}
.shift{font-size:11px;font-weight:700}
.shift.late{color:var(--late)} .shift.early{color:var(--early)}
.empty{margin:40px 0;text-align:center;color:var(--mute)}
.foot{margin:26px 0 0;color:var(--mute);font-size:12px;text-align:center}

/* operator bar */
.ops{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navy);color:var(--onnavy);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ops-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.14);color:var(--onnavy);min-height:48px}
.btn.go{background:var(--live);color:#fff;font-size:15px;line-height:1.25}
.btn.go small{display:block;font-weight:500;font-size:11px;opacity:.9}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid #8cc1ff;outline-offset:2px}

/* editor sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto}
.sheet h2{margin:6px 0 4px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:13px}
.ed{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px;display:grid;gap:8px}
.ed .l1{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ed .l2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ed label{display:block;font-size:11px;color:var(--mute)}
input{width:100%;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--ink)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sheet .btn{background:var(--navy);color:var(--onnavy)}
.sheet .btn.go{background:var(--live)}
.sheet .btn.warn{background:var(--late);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px}
</style></head><body>

<div class="top"><div class="top-in">
  <div class="bar"><h1>同窓ライブ　11/7(土) 神楽坂天窓</h1><div class="clock" id="clock">--:--:--</div></div>
  <div class="tabs"><button type="button" id="tshow" aria-pressed="true">本番</button><button type="button" id="treh" aria-pressed="false">リハーサル</button></div>
  <div class="now">
    <div><div class="lab" id="nowlab">進行状況</div><div class="who" id="nowwho">読み込み中…</div><div class="el" id="nowel"></div></div>
    <div class="delay ontime" id="delay" hidden><div class="v" id="delayv">±0</div><div class="t" id="delayt">定刻</div></div>
  </div>
  <div class="prog"><i id="progbar"></i></div>
</div></div>

<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="ops" id="ops" hidden><div class="ops-in">
  <button class="btn" id="bundo" type="button">戻す</button>
  <button class="btn go" id="bgo" type="button"></button>
  <button class="btn" id="bedit" type="button">編集</button>
</div></div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetin"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var CC={1:'var(--c1)',2:'var(--c2)',3:'var(--c3)',4:'var(--c4)',0:'var(--mute)'};
var SUPABASE_URL='https://wqxkknazxtxpqveqwrqn.supabase.co',SUPABASE_KEY='sb_publishable_c1MB6AiZzzbkKK-pQEQXng_HUjgfOtc';
var db=true,phase='show',PIN='',canEdit=false,sched=null,prog={act:{}},loaded=0,firstScroll=false,editing=false,draft=null;
var $=function(id){return document.getElementById(id)};
function pad(n){return (n<10?'0':'')+n}
function tzParts(ms){var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)),o={};p.forEach(function(x){o[x.type]=x.value});return o}
function mod(ms){var o=tzParts(ms);return (+o.hour%24)*60+ +o.minute+ +o.second/60}
function hhmm(m){m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function hhmmss(ms){var o=tzParts(ms);return (o.hour==='24'?'00':o.hour)+':'+o.minute+':'+o.second}
function parseT(s){if(!s)return null;var a=s.split(':');return +a[0]*60+ +a[1]+(+a[2]||0)/60}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){e.hidden=true},2200)}

function allItems(){return sched&&sched.items?sched.items:[]}
function items(){return allItems().filter(function(x){return (x.phase||'show')===phase})}
function PL(){return phase==='reh'?'リハーサル':'本番'}
function pS(it){return parseT(it.start)}
function pE(it){return pS(it)+(+it.len||0)}
function nowM(){return mod(Date.now())}

/* derive state */
function derive(){
  var its=items(),act=prog.act||{},cur=null,last=null,next=null,done=0;
  its.forEach(function(it){var a=act[it.id];
    if(a&&a.s&&!a.e)cur=it;
    else if(a&&a.e){last=it;done++}
    else if(!next)next=it});
  if(cur){last=null; var li=null; its.forEach(function(it){var a=act[it.id];if(it!==cur&&a&&a.e)li=it});last=li}
  var d=0;
  if(cur){var a=act[cur.id],sd=mod(a.s)-pS(cur),ov=nowM()-pE(cur);d=Math.max(sd,ov)}
  else if(last){d=mod(act[last.id].e)-pE(last)}
  return {cur:cur,last:last,next:next,d:d,done:done,total:its.length}
}

/* render */
function renderStatus(){
  $('clock').textContent=hhmmss(Date.now());
  if(!db){$('nowwho').textContent='サインインすると表示されます';$('delay').hidden=true;return}
  if(!items().length){$('nowwho').textContent=loaded?PL()+'の予定はまだ登録されていません':'読み込み中…';$('delay').hidden=true;return}
  var s=derive(),act=prog.act||{};
  var lab=$('nowlab'),who=$('nowwho'),el=$('nowel');
  if(s.cur){lab.textContent=PL()+' 進行中';who.textContent=s.cur.name;
    var a=act[s.cur.id],em=Math.max(0,Math.floor((Date.now()-a.s)/60000));
    el.textContent=hhmm(mod(a.s))+' 開始・経過 '+em+'分（予定 '+s.cur.len+'分）'}
  else if(s.done===0){lab.textContent=phase==='reh'?'リハ前':'開演前';who.textContent=items()[0].name;el.textContent='最初の出番 '+items()[0].start+' 予定'}
  else if(!s.next){lab.textContent='進行状況';who.textContent=PL()+'は すべて終了しました';el.textContent=''}
  else{lab.textContent='次の出番';who.textContent=s.next.name;el.textContent='前の出番は終了済み・予定 '+s.next.start}
  var dl=$('delay'),r=Math.round(s.d);dl.hidden=(s.done===0&&!s.cur);
  dl.className='delay '+(r>=1?'late':r<=-1?'early':'ontime');
  $('delayv').textContent=(r>0?'+':r<0?'−':'±')+Math.abs(r);
  $('delayt').textContent=r>=1?'分 押し':r<=-1?'分 巻き':'分 定刻';
  $('progbar').style.width=(s.total?Math.round((s.done+(s.cur?.5:0))/s.total*100):0)+'%';
  renderOps(s);
}
function renderOps(s){
  var o=$('ops');o.hidden=!canEdit||!db;if(!canEdit)return;
  var go=$('bgo');
  if(s.cur){go.innerHTML=s.next?'終了して次へ<small>'+esc(s.next.name)+' を開始</small>':'終了<small>'+esc(s.cur.name)+'</small>';go.disabled=false}
  else if(s.next){go.innerHTML='開始<small>'+esc(s.next.name)+'</small>';go.disabled=false}
  else{go.innerHTML='全て終了';go.disabled=true}
  $('bundo').disabled=!(s.cur||s.last);
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function renderList(){
  var L=$('list');
  if(!db){L.innerHTML='<div class="empty">このページはサインインした状態で開くと、進行状況を確認できます。</div>';return}
  var its=items();
  if(!its.length){L.innerHTML='<div class="empty">'+(loaded?PL()+'の予定はまだ登録されていません。':'読み込み中…')+'</div>';return}
  var s=derive(),act=prog.act||{},html='',lastCool=-1,r=Math.round(s.d),seenUp=false;
  its.forEach(function(it){
    if(it.cool!==lastCool&&it.cool){
      var ct=its.filter(function(x){return x.cool===it.cool&&x.kind==='act'}).length;
      html+='<div class="cool" style="--cc:'+CC[it.cool]+'"><b>第'+it.cool+'クール</b><span></span><small>'+ct+'組</small></div>';
    }
    lastCool=it.cool;
    var a=act[it.id],st='',cls='row',tm='',shift='';
    var ps=pS(it),pe=pE(it);
    if(a&&a.e){cls+=' done';st='終了';tm=hhmm(mod(a.s))+'<s>〜'+hhmm(mod(a.e))+'</s>'}
    else if(a&&a.s){cls+=' live';st='進行中';tm=hhmm(mod(a.s))+'<s>予定 '+it.start+'</s>'}
    else{tm=it.start+'<s>〜'+hhmm(pe)+'</s>';
      if(Math.abs(r)>=1&&(s.done>0||s.cur)){shift='<span class="shift '+(r>0?'late':'early')+'">→ '+hhmm(ps+s.d)+'頃</span>'}
      if(!seenUp&&it===s.next&&!s.cur){st='次'}
    }
    if(!a)seenUp=true;
    if(it.kind==='prog')cls+=' prog-item';
    if(it.kind==='break')cls+=' break';
    html+='<div class="'+cls+'" style="--cc:'+CC[it.cool||0]+'" id="r-'+it.id+'"><div class="tm">'+tm+'</div><div class="nm">'+esc(it.name)+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</div><div>'+(st?'<span class="st">'+st+'</span>':shift)+'</div></div>';
  });
  L.innerHTML=html;
  if(!firstScroll&&s.cur){firstScroll=true;var e=$('r-'+s.cur.id);if(e)setTimeout(function(){e.scrollIntoView({block:'center'})},50)}
}
function renderAll(){renderStatus();if(!editing)renderList()}

/* operator actions */
var busy=false;
function saveProg(next,msg){
  if(busy)return;busy=true;prog=next;renderAll();
  rpc('admin_set_progress',{p_pin:PIN,p_act:next.act}).then(function(){if(msg)toast(msg)}).catch(function(e){toast('保存できませんでした：'+(e&&e.message||'')) }).then(function(){busy=false});
}
function cloneProg(){return {act:JSON.parse(JSON.stringify(prog.act||{}))}}
$('bgo').onclick=function(){
  var s=derive(),p=cloneProg(),n=Date.now();
  if(s.cur)p.act[s.cur.id].e=n;
  if(s.cur&&s.next){p.act[s.next.id]={s:n,e:null};saveProg(p,s.next.name+' を開始')}
  else if(s.cur){saveProg(p,s.cur.name+' を終了')}
  else if(s.next){p.act[s.next.id]={s:n,e:null};saveProg(p,s.next.name+' を開始')}
};
$('bundo').onclick=function(){
  var s=derive(),p=cloneProg();
  if(s.cur){
    delete p.act[s.cur.id];
    if(s.last)p.act[s.last.id].e=null;
    saveProg(p,'直前の操作を戻しました');
  }else if(s.last){p.act[s.last.id].e=null;saveProg(p,'終了を取り消しました')}
};

/* editor */
function actDate(hms,ref){ // keep event day: build ms from today's JST date + hh:mm
  var m=parseT(hms);if(m==null||isNaN(m))return null;
  var base=ref||Date.now(),cur=mod(base),diff=(m-cur)*60000;
  return Math.round(base+diff);
}
function openEditor(){
  editing=true;
  draft={items:JSON.parse(JSON.stringify(items())),act:JSON.parse(JSON.stringify(prog.act||{}))};
  drawEditor();$('sheet').hidden=false;
}
function drawEditor(){
  var h='<h2>編集（'+PL()+'）</h2><p>いま開いている「'+PL()+'」の予定を編集します。保存すると全員の画面に反映されます。</p>';
  h+='<div class="ed"><strong style="font-size:13px">'+PL()+'の一括変更</strong>'
   +'<div class="l1"><div><label for="shiftmin">全体をずらす（分・＋で遅く）</label><input id="shiftmin" type="number" value="0" inputmode="numeric"></div><button class="mini" id="shiftgo" type="button" style="align-self:end">ずらす</button></div>'
   +'<div class="l1"><div><label for="firstt">先頭の開始時刻に合わせる</label><input id="firstt" type="time"></div><button class="mini" id="firstgo" type="button" style="align-self:end">合わせる</button></div>'
   +'<div class="l1"><div><label for="alllen">出番の長さをすべて（分）</label><input id="alllen" type="number" inputmode="numeric" placeholder="例 10"></div><button class="mini" id="lengo" type="button" style="align-self:end">変更</button></div></div>';
  draft.items.forEach(function(it,i){
    if((it.phase||'show')!==phase)return;
    var a=draft.act[it.id]||{};
    h+='<div class="ed" data-i="'+i+'"><div class="l1"><div><label>名前</label><input data-f="name" value="'+esc(it.name)+'"></div><div style="display:flex;gap:4px;align-self:end"><button class="mini" data-a="up" type="button" aria-label="上へ">↑</button><button class="mini" data-a="down" type="button" aria-label="下へ">↓</button><button class="mini" data-a="del" type="button" aria-label="削除">×</button></div></div>'
    +'<div class="l2"><div><label>予定開始</label><input data-f="start" type="time" value="'+esc(it.start)+'"></div><div><label>長さ(分)</label><input data-f="len" type="number" inputmode="numeric" value="'+esc(it.len)+'"></div>'
    +'<div><label>実際の開始</label><input data-f="as" type="time" step="1" value="'+(a.s?hhmmss(a.s):'')+'"></div><div><label>実際の終了</label><input data-f="ae" type="time" step="1" value="'+(a.e?hhmmss(a.e):'')+'"></div></div></div>';
  });
  h+='<div class="acts"><button class="btn" id="eadd" type="button">出番を追加</button><button class="btn" id="ebrk" type="button">休憩を追加</button></div>';
  h+='<div class="acts"><button class="btn go" id="esave" type="button">保存</button><button class="btn" id="ecancel" type="button">閉じる</button><button class="btn warn" id="ereset" type="button">この日程の進行をリセット</button></div>';
  $('sheetin').innerHTML=h;
}
function pullDraft(){
  var rows=$('sheetin').querySelectorAll('.ed[data-i]');
  rows.forEach(function(r){
    var it=draft.items[+r.dataset.i];
    r.querySelectorAll('input[data-f]').forEach(function(inp){
      var f=inp.dataset.f,v=inp.value;
      if(f==='name')it.name=v;else if(f==='start')it.start=v||it.start;else if(f==='len')it.len=+v||0;
      else{var a=draft.act[it.id]||(draft.act[it.id]={s:null,e:null});
        if(f==='as')a.s=v?actDate(v,a.s):null;
        if(f==='ae')a.e=v?actDate(v,a.e||a.s):null}
    });
    var a=draft.act[it.id];if(a&&!a.s)delete draft.act[it.id];
  });
}
$('sheetin').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='shiftgo'){pullDraft();var d=+$('shiftmin').value||0;draft.items.forEach(function(it){if((it.phase||'show')===phase)it.start=hhmm(parseT(it.start)+d)});drawEditor();return}
  if(t.id==='firstgo'){pullDraft();var ft=parseT($('firstt').value);var ph=draft.items.filter(function(it){return (it.phase||'show')===phase});if(ft!=null&&ph.length){var dd=ft-parseT(ph[0].start);ph.forEach(function(it){it.start=hhmm(parseT(it.start)+dd)})}drawEditor();return}
  if(t.id==='lengo'){pullDraft();var L=+$('alllen').value;if(L>0)draft.items.forEach(function(it){if((it.phase||'show')===phase&&it.kind!=='break')it.len=L});drawEditor();return}
  if(t.id==='eadd'||t.id==='ebrk'){pullDraft();var ph2=draft.items.filter(function(it){return (it.phase||'show')===phase}),last=ph2[ph2.length-1],st=last?hhmm(pE(last)):'13:00',brk=t.id==='ebrk';
    draft.items.push({id:'x'+Date.now().toString(36),name:brk?'休憩':'新しい出番',cool:last?last.cool:1,kind:brk?'break':'act',phase:phase,start:st,len:brk?10:15});drawEditor();
    $('sheet').scrollTo(0,$('sheet').scrollHeight);return}
  if(t.id==='ecancel'){editing=false;$('sheet').hidden=true;renderAll();return}
  if(t.id==='ereset'){if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='もう一度押すとリセット';return}
    draft.items.forEach(function(it){if((it.phase||'show')===phase)delete draft.act[it.id]});editing=false;$('sheet').hidden=true;firstScroll=false;saveSched(true);return}
  if(t.id==='esave'){pullDraft();editing=false;$('sheet').hidden=true;saveSched(false);return}
  if(t.dataset.a){pullDraft();var i=+t.closest('.ed').dataset.i,a=t.dataset.a,x=draft.items;
    if(a==='del')x.splice(i,1);
    var j=i-1;while(j>=0&&(x[j].phase||'show')!==phase)j--;
    if(a==='up'&&j>=0){var q=x[i];x[i]=x[j];x[j]=q}
    var k=i+1;while(k<x.length&&(x[k].phase||'show')!==phase)k++;
    if(a==='down'&&k<x.length){var q2=x[i];x[i]=x[k];x[k]=q2}
    drawEditor()}
});
function saveSched(reset){
  var its=draft.items;sched={items:its};prog={act:draft.act};renderAll();
  rpc('admin_save_schedule',{p_pin:PIN,p_items:its}).then(function(){return rpc('admin_set_progress',{p_pin:PIN,p_act:draft.act})})
   .then(function(){toast(reset?'進行状況をリセットしました':'保存しました')}).catch(function(e){toast('保存できませんでした：'+(e&&e.message||''))});
}
$('bedit').onclick=openEditor;

/* backend (Supabase REST) */
function api(path,opt){opt=opt||{};opt.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});
  return fetch(SUPABASE_URL+'/rest/v1/'+path,opt).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t)});return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
function rpc(name,body){return api('rpc/'+name,{method:'POST',body:JSON.stringify(body)})}
function load(){
  if(busy||editing)return;
  Promise.all([api('schedule?select=*&order=pos'),api('progress?select=*')]).then(function(r){
    if(busy||editing)return;
    var act={};r[1].forEach(function(p){act[p.id]={s:p.s,e:p.e}});
    sched={items:r[0].map(function(x){return {id:x.id,name:x.name,sub:x.sub,cool:x.cool,kind:x.kind,phase:x.phase||'show',start:x.start,len:x.len}})};
    prog={act:act};loaded=3;renderAll();
  }).catch(function(){loaded=3;renderAll()});
}
/* operator login */
function drawFoot(){
  var f=$('foot');
  f.innerHTML='押し・巻きは予定時刻との差です。後ろの出番の時刻は目安です。<br><a href="#" id="lg" style="color:inherit">'+(canEdit?'運営モード（ログアウト）':'運営ログイン')+'</a><div id="lgf" hidden style="margin-top:8px"><input id="pin" type="password" placeholder="運営PIN" style="width:140px;text-align:center"> <button class="mini" id="pgo" type="button">OK</button></div>';
  $('lg').onclick=function(e){e.preventDefault();if(canEdit){canEdit=false;PIN='';try{localStorage.removeItem('douso_pin')}catch(x){}drawFoot();renderAll()}else{$('lgf').hidden=false;$('pin').focus()}};
  $('pgo').onclick=function(){tryPin($('pin').value)};
}
function tryPin(p){rpc('admin_check',{p_pin:p}).then(function(ok){if(ok){PIN=p;canEdit=true;try{localStorage.setItem('douso_pin',p)}catch(x){}drawFoot();renderAll();toast('運営モードにしました')}else toast('PINが違います')}).catch(function(){toast('接続できません')})}
/* phase tabs */
function setPhase(p,keep){phase=p;firstScroll=false;$('tshow').setAttribute('aria-pressed',p==='show');$('treh').setAttribute('aria-pressed',p==='reh');
  if(!keep){try{localStorage.setItem('douso_phase',p)}catch(x){}}renderAll();window.scrollTo(0,0)}
$('tshow').onclick=function(){setPhase('show')};$('treh').onclick=function(){setPhase('reh')};
try{var sph=localStorage.getItem('douso_phase');if(sph==='reh')setPhase('reh',true)}catch(x){}
/* boot */
setInterval(function(){renderStatus()},1000);
setInterval(function(){if(!editing)renderList()},30000);
setInterval(load,5000);
renderAll();drawFoot();load();
try{var sp=localStorage.getItem('douso_pin');if(sp)tryPin(sp)}catch(x){}
})();
</script>
